services:
  - type: web
    name: sai-room
    runtime: python
    plan: free
    region: singapore
    branch: feature/auth-frontend
    buildCommand: pip install -r sai-room-backend/requirements.txt
    startCommand: python scripts/start_server.py
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: SAI_ENV
        value: production
      - key: SAI_DATABASE_URL
        sync: false
      - key: SAI_DATABASE_SSL_ROOT_CERT
        value: certs/supabase-prod-ca-2021.crt
      - key: SAI_INITIAL_OPERATOR_CODE
        generateValue: true
