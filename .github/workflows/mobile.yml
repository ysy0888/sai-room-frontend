name: Mobile build validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true
      - run: python3 scripts/mobile-scene.py --check
      - run: flutter pub get && flutter analyze && flutter test && flutter build appbundle --release
        working-directory: mobile_flutter
  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true
      - run: flutter pub get && flutter build ios --release --no-codesign
        working-directory: mobile_flutter
