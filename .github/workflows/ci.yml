name: Verify SAI ROOM
on:
  push:
    branches: [feature/auth-frontend]
  pull_request:
permissions:
  contents: read
concurrency:
  group: sai-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sai-room-backend/requirements-dev.lock
      - run: npm ci
      - run: pip install -r sai-room-backend/requirements-dev.lock
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
