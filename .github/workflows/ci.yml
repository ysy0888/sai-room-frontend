name: Verify SAI ROOM
on:
  push:
    branches: [feature/auth-frontend]
  pull_request:
permissions:
  contents: read
concurrency:
  group: sai-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sai-room-backend/requirements-dev.lock
      - run: npm ci
      - run: pip install -r sai-room-backend/requirements-dev.lock
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:server
      - name: Verify API against PostgreSQL
        run: npm run test:server
        env:
          SAI_TEST_POSTGRES_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/sai_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
