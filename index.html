<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="description" content="SAI 동아리방 현황과 예약" />
    <title>SAI ROOM · 동방 현황</title>
    <link rel="icon" href="assets/sai-logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/motion.css" />
    <link rel="stylesheet" href="css/bottle.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/launch.css" />
    <link rel="stylesheet" href="css/community.css" />
    <link rel="stylesheet" href="css/schedule.css" />
    <script src="js/config.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/backend.js" defer></script>
    <script src="js/liquid.js" defer></script>
    <script src="js/presence.js" defer></script>
    <script src="js/soft-physics.js" defer></script>
    <script src="js/bottle-3d.js" defer></script>
    <script src="js/member-bottle.js" defer></script>
    <script src="js/motion.js" defer></script>
    <script src="js/device-motion.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body data-theme="light" data-route="loading">
    <div id="app" class="app-shell">
      <header class="app-header" id="header"></header>
      <main class="view" id="view" tabindex="-1"><div class="launch-screen" role="status"><div class="launch-mark"><img src="assets/sai-logo.png" alt="SAI 동아리 로고" width="112" height="112"></div><strong class="launch-wordmark">SAI ROOM</strong><span class="launch-progress" aria-hidden="true"></span><p>불러오는 중</p><span class="launch-caption">SEJONG ARTIFICIAL INTELLIGENCE</span></div></main>
      <div id="action-dock" class="action-dock" hidden></div>
      <nav class="bottom-nav" id="nav" aria-label="주요 메뉴"></nav>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog
      class="confirm-dialog"
      id="confirm-dialog"
      aria-labelledby="confirm-title"
    >
      <h2 id="confirm-title">확인</h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button class="secondary-button" id="confirm-no">돌아가기</button
        ><button class="danger-button" id="confirm-yes">확인</button>
      </div>
    </dialog>
    <dialog id="presence-dialog" class="presence-dialog" aria-labelledby="presence-title">
      <div class="sheet-handle" aria-hidden="true"></div><div class="sheet-top"><h2 id="presence-title">이용 중인 회원</h2><button class="icon-button" data-action="close-presence" aria-label="닫기">×</button></div>
      <div id="presence-details-body"></div><button class="primary-button" data-action="close-presence">닫기</button>
    </dialog>
    <noscript>이 앱을 사용하려면 브라우저의 JavaScript를 켜주세요.</noscript>
  </body>
</html>
